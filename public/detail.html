<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>아사나 — ASANA</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script
    defer
    src="media.js"
  ></script>

  <script
    defer
    src="script.js?v=20261003-1"
  ></script>
</head>

<body>
  <header>
    <a
      class="brand"
      href="index.html"
    >
      ASANA
      <span>몸으로 쓰는 갤러리</span>
    </a>

    <a href="index.html">
      ← 모든 아사나
    </a>
  </header>

  <main>
    <section class="detail-intro">
      <p>ONE ASANA, MANY PEOPLE</p>

      <div class="detail-title">
        <h1 id="name">
          아사나
        </h1>

        <span id="english-name"></span>
      </div>

      <div class="detail-sanskrit">
        <p id="sanskrit-roman"></p>
        <p id="sanskrit-korean"></p>
      </div>

      <section class="pose-description">
        <h2>자세 설명</h2>
        <p id="description"></p>
      </section>
    </section>

    <p
      id="status"
      role="status"
    >
      자세를 불러오는 중…
    </p>

    <div
      id="gallery"
      class="gallery"
    ></div>

    <section
      id="video-section"
      class="video-section"
      hidden
    >
      <p>IN MOTION</p>

      <h2>
        움직임으로 보기
      </h2>

      <div id="video"></div>
    </section>
  </main>

  <dialog id="lightbox">
    <button
      id="close"
      aria-label="사진 닫기"
    >
      닫기 ×
    </button>

    <img
      id="large"
      alt=""
    >

    <p id="caption"></p>
  </dialog>

  <footer>
    같은 자세, 서로 다른 우리. · ASANA GALLERY
  </footer>
</body>
</html>
